services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chess_app
      POSTGRES_USER: chess_app
      POSTGRES_PASSWORD: chess_app
    # 5433 on the host: 5432 is commonly taken by a native Postgres install.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/chess-app;
      mc anonymous set download local/chess-app;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
